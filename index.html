
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring ATK PLA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      color: #1e293b;
      margin: 0;
    }
    .glass {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    /* Modal Force Visibility */
    .modal-overlay {
      background: rgba(15, 23, 42, 0.85);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-box {
      background: white !important;
      width: 100%;
      max-width: 500px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow: hidden;
    }

    /* PRINT STYLES */
    @media print {
      nav, button, .no-print, input, .control-panel, select, .sticky {
        display: none !important;
      }
      body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      main {
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
      }
      .max-w-7xl, .max-w-6xl {
        max-width: none !important;
        width: 100% !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        font-size: 10px !important;
      }
      th, td {
        border: 1px solid #e2e8f0 !important;
        padding: 8px !important;
      }
      .shadow-2xl, .shadow-xl, .shadow-sm {
        box-shadow: none !important;
      }
      .rounded-[40px], .rounded-3xl, .rounded-2xl {
        border-radius: 0 !important;
      }
      .bg-white {
        background: transparent !important;
      }
      .bg-slate-50, .bg-indigo-50, .bg-orange-50, .bg-emerald-50 {
        background: #f1f5f9 !important;
        print-color-adjust: exact;
      }
      .text-indigo-600 { color: #4f46e5 !important; }
      .text-orange-600 { color: #ea580c !important; }
      .text-emerald-600 { color: #16a34a !important; }
    }
  </style>
